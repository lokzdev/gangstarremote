# ==================== OTIMIZAÇÕES DE BUILD ====================
# JVM com mais memória para builds rápidos
org.gradle.jvmargs=-Xmx4096m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:MaxMetaspaceSize=512m

# Habilita daemon (mantém Gradle rodando em background)
org.gradle.daemon=true

# Builds paralelos
org.gradle.parallel=true

# Cache de configuração (Gradle 7.5+)
org.gradle.configuration-cache=true

# Cache de builds
org.gradle.caching=true

# Compilação incremental do Kotlin
kotlin.incremental=true

# ==================== ANDROID ====================
android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=true

# Desabilita verificações desnecessárias
android.defaults.buildfeatures.buildconfig=false
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.renderscript=false
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false
